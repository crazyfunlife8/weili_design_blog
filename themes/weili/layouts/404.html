{{ define "main" }}
<section class="hero" style="min-height:40vh;display:flex;align-items:center;">
  <div class="hero-inner">
    <p class="hero-label">404 — 找不到頁面</p>
    <h1 style="font-size:clamp(2rem,5vw,3.5rem);">這個頁面<br>不存在了。</h1>
    <span class="hero-rule" aria-hidden="true"></span>
    <p class="hero-desc">可能是網址有誤，或文章已移除。</p>
    <a href="{{ .Site.BaseURL }}" style="display:inline-block;margin-top:1.5rem;font-family:var(--font-ui);font-weight:700;font-size:.875rem;color:var(--color-accent);letter-spacing:.04em;border-bottom:1px solid var(--color-accent);padding-bottom:2px;transition:opacity 120ms ease-out;" onmouseenter="this.style.opacity='.6'" onmouseleave="this.style.opacity='1'">← 回到首頁</a>
  </div>
</section>
{{ end }}
